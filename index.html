<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Composer Atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=20261111m" />
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand-home" href="#/" title="Home" aria-label="Composer Atlas: home">
      <span class="brand-mark"></span>
      <h1>Composer Atlas</h1>
      <span class="brand-sub" id="brand-sub">&nbsp;</span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/" data-view="home">Home</a>
      <a href="#/timeline" data-view="timeline">Timeline</a>
      <a href="#/map" data-view="map">World map</a>
      <a href="#/composers" data-view="composers">Composers</a>
      <a href="#/links" data-view="links">Connections</a>
    </nav>
    <div class="legend" id="legend"></div>
  </header>

  <main class="layout">
    <section class="view view-home" id="view-home" hidden></section>

    <section class="view view-map" id="view-map" hidden></section>

    <section class="view view-composers" id="view-composers" hidden></section>

    <section class="view view-links" id="view-links" hidden></section>

    <section class="view timeline-wrap" id="timeline-wrap" hidden>
      <div class="timeline-controls">
        <button class="zoom-btn" id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <span class="zoom-readout" id="zoom-readout">1×</span>
        <button class="zoom-btn" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      </div>
      <div class="timeline-scroll" id="timeline-scroll"></div>
      <div class="tooltip" id="tooltip" hidden></div>
    </section>

    <aside class="panel" id="panel" aria-hidden="true">
      <div class="panel-controls">
        <button class="panel-close" id="panel-close" aria-label="Close panel" title="Close (Esc)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 18l6-6-6-6"></path>
            <path d="M5 18l6-6-6-6"></path>
          </svg>
        </button>
        <button class="panel-expand" id="panel-expand" aria-label="Expand to full page" title="Expand to full page">
          <svg class="icon-expand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <svg class="icon-collapse" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
      <div class="panel-inner" id="panel-inner"></div>
    </aside>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Portrait viewer">
      <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
      <div class="lightbox-content" id="lightbox-content"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="app.js?v=20261111m"></script>
</body>
</html>
